name: Build the Reference FMUs

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:

  lint-files:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: python3 build/lint_files.py

  build:
    strategy:
      matrix:
        include:
          - name: x86-windows
            image: windows-2022
            arch: x86
          - name: x86_64-windows
            image: windows-2022
            arch: x86_64
          - name: x86_64-linux
            image: ubuntu-22.04
            arch: x86_64
          - name: aarch64-linux
            image: ubuntu-22.04
            arch: aarch64
          - name: aarch64-darwin
            image: macos-14
            arch: aarch64
          - name: wasm32-wasip2
            image: ubuntu-22.04
            arch: x86_64
    runs-on: ${{ matrix.image }}
    needs: lint-files
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: which python
    - run: python -m pip install fmpy==0.3.21 pytest requests scipy
    - if: matrix.name == 'aarch64-linux'
      run: |
        sudo apt-get update
        sudo apt-get install gcc-aarch64-linux-gnu qemu-user
    - if: matrix.name == 'wasm32-wasip2'
      uses: dtolnay/rust-toolchain@stable
    - if: matrix.name == 'wasm32-wasip2'
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
    - if: matrix.name == 'wasm32-wasip2'
      run: |
        cargo install wit-bindgen-cli --locked
        cargo install wasm-tools --locked
    - if: matrix.name == 'wasm32-wasip2'
      run: |
        curl -sL -o wasi-sdk.tar.gz \
          https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
        tar xzf wasi-sdk.tar.gz
        echo "WASI_SDK_PATH=${{ github.workspace }}/wasi-sdk-34.0-x86_64-linux" >> $GITHUB_ENV
    - run: cmake --version
    - run: python build/build.py ${{ matrix.name }}
    # - if: matrix.name != 'aarch64-darwin'
    #   run: pytest tests --platform ${{ matrix.name }}
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.name }}
        path: build/fmus
        if-no-files-found: error

  merge-fmus:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    - name: Install fmusim
      run: |
        curl -LsSf https://raw.githubusercontent.com/modelica/fmusim/refs/heads/main/install.sh | sh
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install fmpy==0.3.20 pytest scipy kaleido markdown2 plotly pytz
   
    - uses: actions/checkout@v7
    
    - uses: actions/download-artifact@v8
      with:
        name: x86-windows
        path: dist-x86-windows
    
    - uses: actions/download-artifact@v8
      with:
        name: x86_64-windows
        path: dist-x86_64-windows

    - uses: actions/download-artifact@v8
      with:
        name: x86_64-linux
        path: dist-x86_64-linux

    - uses: actions/download-artifact@v8
      with:
        name: aarch64-linux
        path: dist-aarch64-linux

    - uses: actions/download-artifact@v8
      with:
        name: aarch64-darwin
        path: dist-aarch64-darwin

    - uses: actions/download-artifact@v8
      with:
        name: wasm32-wasip2
        path: dist-wasm32-wasip2

    - run: git status --porcelain --untracked=no
    - run: git tag --contains
    - run: git rev-parse --short HEAD

    - name: Run merge binaries script
      run: |
        python build/merge_binaries.py

    - run: git status --porcelain --untracked=no
    - run: git tag --contains
    - run: git rev-parse --short HEAD

    - uses: actions/upload-artifact@v7
      with:
        name: Reference-FMUs
        path: dist-merged
        if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: merge-fmus
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: Reference-FMUs
        path: dist-merged

    - name: Pack Reference-FMUs.zip
      run: |
        (cd dist-merged && zip -r ../Reference-FMUs.zip .)

    - uses: softprops/action-gh-release@v2
      with:
        files: Reference-FMUs.zip
        generate_release_notes: true
